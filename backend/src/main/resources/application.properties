# Server configuration
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Application Name
spring.application.name=SIMPONI Attendance System

# Database configuration (PostgreSQL 16)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simponi_db}
spring.datasource.username=${DB_USER:simponi_user}
spring.datasource.password=${DB_PASSWORD:simponi_secure_pass_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Static resource handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

